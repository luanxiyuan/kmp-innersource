<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 知识库助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-right: 10px;
        }

        .message.user .message-avatar {
            background: #e0e0e0;
            color: #666;
            margin-left: 10px;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.bot .message-content {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 18px 18px 18px 4px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .message-content pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .message-content code {
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .message.user .message-content code {
            background: rgba(255, 255, 255, 0.2);
        }

        .message-source {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            padding-top: 8px;
            border-top: 1px solid #eee;
        }

        .message-score {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #user-input:focus {
            border-color: #667eea;
        }

        #send-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #send-button:active {
            transform: translateY(0);
        }

        #send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .suggestions {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            background: white;
            border-top: 1px solid #f0f0f0;
            overflow-x: auto;
        }

        .suggestion {
            padding: 8px 16px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .suggestion:hover {
            background: #e0e0e0;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typing {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        .status {
            padding: 10px 20px;
            background: #fff3cd;
            color: #856404;
            font-size: 13px;
            border-bottom: 1px solid #ffc107;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
            border-color: #28a745;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border-color: #dc3545;
        }

        /* Scrollbar styling */
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI 知识库助手</h1>
            <p>基于 Confluence 文档的智能问答系统</p>
        </div>

        <div id="status" class="status">
            ⚠ 正在连接到 Rasa 服务器...
        </div>

        <div class="chat-container" id="chat-container">
            <!-- 消息将在这里动态添加 -->
            <div class="message bot">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    你好！我是知识库助手，可以帮你查找文档和解答问题。
                    <br><br>
                    你可以问我：
                    <ul style="margin-left: 20px; margin-top: 8px;">
                        <li>如何部署服务</li>
                        <li>数据库配置方法</li>
                        <li>错误排查流程</li>
                        <li>API 使用说明</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="suggestions">
            <div class="suggestion" onclick="sendSuggestion('如何部署服务')">如何部署服务</div>
            <div class="suggestion" onclick="sendSuggestion('数据库配置方法')">数据库配置方法</div>
            <div class="suggestion" onclick="sendSuggestion('错误排查流程')">错误排查流程</div>
            <div class="suggestion" onclick="sendSuggestion('API 使用说明')">API 使用说明</div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="输入你的问题..." autocomplete="off">
                <button id="send-button" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        const RASA_URL = 'http://localhost:5005/webhooks/rest/webhook';
        let isConnected = false;

        // 连接到 Rasa 服务器
        async function checkConnection() {
            try {
                const response = await fetch(RASA_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: 'ping'
                    })
                });
                
                if (response.ok) {
                    isConnected = true;
                    updateStatus('✅ 已连接到 Rasa 服务器', 'connected');
                } else {
                    updateStatus('⚠ Rasa 服务器响应异常', 'error');
                }
            } catch (error) {
                isConnected = false;
                updateStatus('❌ 无法连接到 Rasa 服务器，请确保 Rasa 服务已启动', 'error');
            }
        }

        // 更新状态显示
        function updateStatus(message, statusClass) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + statusClass;
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 添加用户消息到聊天界面
            addMessage('user', message);
            input.value = '';
            
            // 禁用发送按钮
            const sendButton = document.getElementById('send-button');
            sendButton.disabled = true;
            
            // 显示打字指示器
            showTypingIndicator();
            
            // 发送到 Rasa
            try {
                const response = await fetch(RASA_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });
                
                const data = await response.json();
                
                // 移除打字指示器
                hideTypingIndicator();
                
                // 显示机器人回复
                if (data && data.length > 0) {
                    data.forEach(reply => {
                        addMessage('bot', reply.text);
                    });
                } else {
                    addMessage('bot', '抱歉，我没有收到回复。请稍后再试。');
                }
                
            } catch (error) {
                hideTypingIndicator();
                addMessage('bot', '❌ 连接服务器失败，请检查 Rasa 服务是否已启动。');
                updateStatus('❌ 连接失败', 'error');
            }
            
            // 启用发送按钮
            sendButton.disabled = false;
        }

        // 添加消息到聊天界面
        function addMessage(sender, content) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = sender === 'bot' ? '🤖' : '👤';
            
            // 简单的 markdown 处理
            const formattedContent = formatMarkdown(content);
            
            messageDiv.innerHTML = `
                ${sender === 'bot' ? '<div class="message-avatar">' + avatar + '</div>' : ''}
                <div class="message-content">${formattedContent}</div>
                ${sender === 'user' ? '<div class="message-avatar">' + avatar + '</div>' : ''}
            `;
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 简单的 Markdown 格式化
        function formatMarkdown(text) {
            if (!text) return '';
            
            // 代码块
            text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            
            // 行内代码
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // 粗体
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            
            // 换行
            text = text.replace(/\n/g, '<br>');
            
            return text;
        }

        // 显示打字指示器
        function showTypingIndicator() {
            const chatContainer = document.getElementById('chat-container');
            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'message bot';
            indicatorDiv.id = 'typing-indicator';
            indicatorDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            chatContainer.appendChild(indicatorDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 隐藏打字指示器
        function hideTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // 发送建议
        function sendSuggestion(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        // 回车发送
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 页面加载时检查连接
        window.onload = function() {
            checkConnection();
            // 每 30 秒检查一次连接状态
            setInterval(checkConnection, 30000);
        };
    </script>
</body>
</html>
