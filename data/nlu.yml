version: "3.1"

nlu:
  # 通用问候
  - intent: greet
    examples: |
      - 你好
      - 嗨
      - hello
      - hi
      - 早上好
      - 下午好
      - 晚上好
      - 大家好
      - 在吗
      - 在线吗

  # 通用问题询问
  - intent: ask_question
    examples: |
      - 如何部署服务
      - 怎么部署
      - 部署流程是什么
      - 数据库配置方法
      - 如何配置数据库
      - 配置数据库的步骤
      - 错误处理
      - 遇到错误怎么办
      - 如何解决错误
      - 调试方法
      - 如何调试
      - 日志查看
      - 在哪里看日志
      - 访问日志
      - 权限设置
      - 如何设置权限
      - 配置权限
      - 安装依赖
      - 怎么安装依赖
      - 环境配置
      - 如何配置环境
      - 环境变量设置
      - API 使用
      - 怎么调用 API
      - 接口文档
      - 哪里有接口文档
      - 测试方法
      - 如何测试
      - 测试流程
      - 代码规范
      - 编码规范
      - 提交代码
      - 如何提交代码
      - 代码审查
      - 代码审查流程
      - 版本管理
      - 如何管理版本
      - 发布流程
      - 怎么发布
      - 上线步骤
      - 备份策略
      - 如何备份
      - 数据恢复
      - 怎么恢复数据
      - 性能优化
      - 如何优化性能
      - 慢查询优化
      - 缓存策略
      - 如何使用缓存
      - 安全配置
      - 如何设置安全
      - 加密方法
      - 如何加密
      - 监控配置
      - 如何监控
      - 告警设置
      - 如何设置告警
      - 故障排查
      - 如何排查故障
      - 常见问题
      - FAQ
      - 问题汇总
      - 常见错误
      - 问题解决方案
      - 遇到问题怎么解决
      - 帮我看一下
      - 查找资料
      - 搜索相关内容
      - 找文档
      - 文档在哪

  # 感谢
  - intent: thank
    examples: |
      - 谢谢
      - 感谢
      - 非常感谢
      - 谢谢了
      - 多谢
      - thanks
      - thank you
      - 太感谢了
      - 谢谢你的帮助
      - 帮大忙了

  # 道别
  - intent: goodbye
    examples: |
      - 再见
      - 拜拜
      - bye
      - 88
      - 下次见
      - 回头聊
      - 走了
      - 我走了
      - 谢了再见
      - 有空再聊

  # 确认
  - intent: affirm
    examples: |
      - 是的
      - 对
      - 对的
      - 是
      - 没错
      - 正确
      - 对头
      - 嗯
      - 好的
      - ok
      - OK
      - 可以
      - 没问题
      - 确认
      - 确定
      - 同意

  # 否认
  - intent: deny
    examples: |
      - 不是
      - 不对
      - 错了
      - 没有
      - 不
      - 不行
      - 不可以
      - 否
      - 不对劲
      - 不正确
      - 不需要
      - 不用

  # 询问能力
  - intent: ask_capabilities
    examples: |
      - 你能做什么
      - 你有什么功能
      - 你会什么
      - 支持什么问题
      - 你能帮我什么
      - 怎么使用你
      - 如何提问
      - 你能回答哪些问题
      - 你的功能是什么

  # 不理解
  - intent: out_of_scope
    examples: |
      - 我不知道
      - 不清楚
      - 不明白
      - 不懂
      - 没听懂
      - 什么意思
      - 你在说什么
      - 谁是 AI
      - 你是人吗
      - 你叫什么名字
